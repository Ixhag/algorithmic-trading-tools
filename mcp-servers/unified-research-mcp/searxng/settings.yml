# SearXNG settings for the Unified Research MCP server.
# Everything not listed here uses SearXNG's defaults.
use_default_settings: true

general:
  instance_name: "Unified Research (local)"

server:
  limiter: false        # private instance on this PC only; the bot limiter would block the MCP server
  image_proxy: false
  public_instance: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json              # required: the MCP server reads results as JSON

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
